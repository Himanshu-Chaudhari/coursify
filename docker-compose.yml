version: '3.8'

services:
  backend:
    image: express-backend  
    container_name: backend-container
    ports:
      - "3000:3000"                   
    networks:
      - app-network

  frontend:
    image: react-frontend
    container_name: frontend-container
    ports:
      - "5173:5173"                   
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
